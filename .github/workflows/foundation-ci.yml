name: Foundation CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python-platform-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Foundation CLI and golden path
        run: python -m unittest discover -s tests -v
  typescript-golden-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install TypeScript seed
        working-directory: templates/typescript-api
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Strict TypeScript
        working-directory: templates/typescript-api
        run: npm run typecheck
      - name: Node test
        working-directory: templates/typescript-api
        run: npm test
      - name: Build
        working-directory: templates/typescript-api
        run: npm run build
      - name: Validate generated TypeScript project end-to-end
        run: |
          python -m foundation init --stack typescript-api --dest "${RUNNER_TEMP}/g0-typescript-seed"
          cd "${RUNNER_TEMP}/g0-typescript-seed"
          npm ci --ignore-scripts --no-audit --no-fund
          cd "$GITHUB_WORKSPACE"
          python -m foundation verify --project "${RUNNER_TEMP}/g0-typescript-seed"
