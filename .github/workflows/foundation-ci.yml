name: Foundation CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python-platform-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Foundation CLI and golden path
        run: python -m unittest discover -s tests -v
  typescript-golden-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install TypeScript seed
        working-directory: templates/typescript-api
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Strict TypeScript
        working-directory: templates/typescript-api
        run: npm run typecheck
      - name: Node test
        working-directory: templates/typescript-api
        run: npm test
      - name: Build
        working-directory: templates/typescript-api
        run: npm run build

  g0-generate-lockfile-once:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Generate real npm lockfile from registry
        working-directory: templates/typescript-api
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          echo FOUNDATION_LOCKFILE_BEGIN
          cat package-lock.json
          echo FOUNDATION_LOCKFILE_END
