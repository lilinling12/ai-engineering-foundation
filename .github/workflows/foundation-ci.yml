name: Foundation CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python-platform-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Foundation CLI and golden path
        run: python -m unittest discover -s tests -v
  typescript-golden-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install TypeScript seed
        working-directory: templates/typescript-api
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Strict TypeScript
        working-directory: templates/typescript-api
        run: npm run typecheck
      - name: Node test
        working-directory: templates/typescript-api
        run: npm test
      - name: Build
        working-directory: templates/typescript-api
        run: npm run build
      - name: Validate generated TypeScript project end-to-end
        run: |
          python -m foundation init --stack typescript-api --dest "${RUNNER_TEMP}/g0-typescript-seed"
          cd "${RUNNER_TEMP}/g0-typescript-seed"
          npm ci --ignore-scripts --no-audit --no-fund
          cd "$GITHUB_WORKSPACE"
          python -m foundation verify --project "${RUNNER_TEMP}/g0-typescript-seed" --trust-project-code
  offline-docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pull disposable smoke-test Python image
        run: docker pull python:3.12-slim
      - name: Execute real offline containers on GitHub-hosted runner
        env:
          FOUNDATION_EPHEMERAL_RUNNER: 'yes'
        run: |
          IMAGE_DIGEST="$(docker image inspect --format '{{index .RepoDigests 0}}' python:3.12-slim)"
          python -m foundation.docker_smoke --image "$IMAGE_DIGEST"
      - name: Upload non-attested smoke log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: offline-docker-smoke
          path: artifacts/offline-docker-smoke.json
          if-no-files-found: ignore
  codex-cli-interface-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install exact Codex CLI version in disposable job (no credentials)
        working-directory: tools/codex-cli
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify real binary and documented exec options (no inference)
        run: |
          CODEX="${GITHUB_WORKSPACE}/tools/codex-cli/node_modules/.bin/codex"
          "$CODEX" --version | grep '0.162.1'
          "$CODEX" exec --help > "${RUNNER_TEMP}/codex-exec-help.txt"
          for option in --sandbox --ephemeral --ignore-user-config --output-schema --output-last-message; do
            grep -q -- "$option" "${RUNNER_TEMP}/codex-exec-help.txt"
          done
  g16-synthetic-offline-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pull disposable Python runtime before sandboxing
        run: docker pull python:3.12-slim
      - name: Run synthetic proposed code through offline isolated evaluation
        env:
          FOUNDATION_EPHEMERAL_RUNNER: 'yes'
        run: |
          IMAGE_DIGEST="$(docker image inspect --format '{{index .RepoDigests 0}}' python:3.12-slim)"
          python -m foundation.g16_eval --image "$IMAGE_DIGEST"
      - name: Upload non-attested synthetic evaluation outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g16-synthetic-offline-eval
          path: artifacts/g16-synthetic-offline-eval.json
          if-no-files-found: ignore
  g18-kvm-capability-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Query /dev/kvm KVM_GET_API_VERSION (no VM, no secrets)
        run: python -m foundation.g18_kvm_probe
      - name: Upload unsigned capability observation even when KVM unavailable
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g18-kvm-host-preflight
          path: artifacts/g18-kvm-host-preflight.json
          if-no-files-found: error
  g21-build-guest-rootfs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Confirm unprivileged compiler and ext4 utilities
        run: |
          command -v gcc
          command -v readelf
          command -v mke2fs
          command -v debugfs
          command -v e2fsck
      - name: Build actual static init and ext4 rootfs (no KVM, no credentials)
        run: |
          python -m foundation.g21_build_guest --dest "$RUNNER_TEMP/g21-rootfs"
          mkdir -p artifacts/g21-rootfs
          cp "$RUNNER_TEMP/g21-rootfs/manifest.json" artifacts/g21-rootfs/
          cp "$RUNNER_TEMP/g21-rootfs/rootfs.ext4" artifacts/g21-rootfs/
      - name: Assert manifest cannot claim guest boot or VM security
        run: |
          python -c 'import json,pathlib; v=json.loads(pathlib.Path("artifacts/g21-rootfs/manifest.json").read_text()); assert v["contract"]=="foundation.synthetic-guest-assets/v0" and v["guestBootVerified"] is False and v["vmAdmissionAllowed"] is False and v["kernelIncluded"] is False'
      - name: Upload unsigned synthetic rootfs build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g21-synthetic-guest-rootfs
          path: artifacts/g21-rootfs/
          if-no-files-found: error
          retention-days: 3
  g23-official-kernel-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Discover actual Firecracker official CI kernel candidate
        run: python -m foundation.g23_kernel_inventory
      - name: Upload unsigned candidate inventory only (NEVER boot discovered image)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g23-official-kernel-inventory
          path: artifacts/g23-official-kernel-inventory.json
          if-no-files-found: error
